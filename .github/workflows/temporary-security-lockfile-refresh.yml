name: Temporary security lockfile refresh
on:
  push:
    branches:
      - security/patch-next-oct-2026
permissions:
  contents: write
jobs:
  refresh-lockfile:
    if: github.event.head_commit.message != 'chore(deps): regenerate lockfile for patched Next.js'
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Regenerate npm lockfile without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile update
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already consistent"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(deps): regenerate lockfile for patched Next.js"
          git push
