name: Dependency vulnerability lockfile remediation
on:
  push:
    branches:
      - "security/dependency-remediation-*"
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
permissions:
  contents: write
jobs:
  remediate:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message != 'chore(deps): refresh lockfile after audit fix')
      || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.head_ref, 'security/dependency-remediation-'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply non-breaking npm vulnerability fixes
        run: |
          if [ -f package-lock.json ]; then
            npm audit fix --package-lock-only --ignore-scripts --no-fund || audit_status=$?
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          fi
          if [ -f apps/web/package-lock.json ]; then
            (cd apps/web && npm audit fix --package-lock-only --ignore-scripts --no-fund || true)
            (cd apps/web && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          fi
      - name: Commit refreshed lockfiles
        run: |
          git add package-lock.json apps/web/package-lock.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No lockfile changes were needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deps): refresh lockfile after audit fix"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
