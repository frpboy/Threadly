name: Threadly web validation

on:
  pull_request:
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/web-ci.yml"

permissions:
  contents: read

concurrency:
  group: threadly-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests, typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_OPTIONS: ""
      NODE_PATH: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install web dependencies
        run: npm ci --workspace apps/web

      - name: Test attempt transactions, route guards and progress
        run: |
          npm test --workspace apps/web
          node --test apps/web/tests/progress-service.test.mjs

      - name: Build Next.js application
        env:
          DATABASE_URL: "postgresql://ci:ci@127.0.0.1:5432/threadly_ci"
          AUTH_SECRET: "threadly-ci-placeholder-only"
        working-directory: apps/web
        run: node scripts/build-verified.mjs

      - name: Validate published progress through the production bundle
        run: node apps/web/scripts/built-progress-smoke.mjs
